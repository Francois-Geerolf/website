name: Build Themes

on:
  push:
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'
  schedule:
    - cron: '0 */1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FRED_KEY: ${{ secrets.FRED_KEY }}
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup R
        uses: r-lib/actions/setup-r@v2
    
      - name: 📦 Setup R dependencies (pak + system libs)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: stable
          
      - name: 🧰 Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 📦 Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        
      - name: 🔎 Debug path
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -R $GITHUB_WORKSPACE | head -n 200
          
      - name: 📦 Install required packages with timing and checks with _packages_install.R
        run: Rscript _packages_install.R
        
      - name: 🌍 Add fr_FR.UTF-8 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale

      - name: ▶️ Run data/_build.R
        working-directory: ${{ github.workspace }}
        run: Rscript data/_build.R

      - name: 💾 Commit calendrier history
        if: github.event_name != 'pull_request'
        continue-on-error: true   # best-effort : ne doit jamais bloquer le deploy
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Le build ne modifie qu'un seul fichier suivi : le CSV d'historique.
          # On le met de côté, puis à chaque tentative on repart de la version
          # distante la plus fraîche et on reconstruit l'union (aucun merge git,
          # donc jamais de marqueur "<<<<<<<" dans le fichier publié).
          BUILT="$RUNNER_TEMP/calendrier_built.csv"
          cp data/insee/calendrier_historique.csv "$BUILT"

          pushed=""
          for i in 1 2 3 4 5; do
            git fetch origin "$BR" --quiet || true
            git reset --hard "origin/$BR" --quiet   # sûr : ne touche pas aux HTML non suivis
            python3 data/insee/_merge_historique.py \
              data/insee/calendrier_historique.csv "$BUILT" data/insee/calendrier_historique.csv
            git add data/insee/calendrier_historique.csv
            if git diff --staged --quiet; then
              echo "calendrier: rien de nouveau"; pushed="skip"; break
            fi
            git commit -m "calendrier: historique des publications Insee [skip ci]" --quiet
            if git push origin "HEAD:$BR" --quiet; then pushed="ok"; break; fi
            echo "push refusé, nouvelle tentative ($i)"; sleep 3
          done
          [ -n "$pushed" ] || echo "calendrier: abandon après 5 tentatives"

      - name: 🔐 Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      
      - name: 🧾 Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 147.79.103.253 >> ~/.ssh/known_hosts
  
      - name: 📤 Deploy to remote server via rsync
        run: |
          rsync --exclude-from=<(cat <<EOF
            .git
            *.RData
            *.Rmd
            *.qmd
            *.xlsx
            *.xls
            *.txt
            *.zip
            *.csv
            *.sh
            *.py
            *.parquet
            *.crdownload
            *.curltmp
          EOF
          ) -avr -e 'ssh -p65002 -oHostKeyAlgorithms=+ssh-rsa' ./ \
          u597408863@147.79.103.253:~/domains/fgeerolf.com/public_html/