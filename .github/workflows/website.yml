name: Build Website Root

on:
  push:
    paths:
      - "/*"        # only files directly in the root folder
      - "!/**/**"   # exclude subfolders
  pull_request:
    paths:
      - "/*"        # only files directly in the root folder
      - "!/**/**"   # exclude subfolders
  schedule:
    - cron: '0 5 * * *'   # tous les jours à 05:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FRED_KEY: ${{ secrets.FRED_KEY }}
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup R
        uses: r-lib/actions/setup-r@v2 
        
      - name: 🧰 Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.550 # or whatever version you use
          
      - name: 🛠 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libjpeg-dev libtiff5-dev \
            libxml2-dev libcurl4-openssl-dev libssl-dev libicu-dev \
            libmagick++-dev pkg-config

      - name: 📦 Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        
      - name: 🔎 Debug path
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -R $GITHUB_WORKSPACE | head -n 200
          
      - name: 📦 Install required packages with timing and checks with _packages_install.R
        run: Rscript _packages_install.R
        
      - name: 🌍 Add fr_FR.UTF-8 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale

      - name: ▶️ Run _build.R
        working-directory: ${{ github.workspace }}
        run: Rscript _build.R
  
      - name: 🔐 Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      
      - name: 🧾 Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 147.79.103.253 >> ~/.ssh/known_hosts
  
      - name: 📤 Deploy to remote server via rsync
        run: |
          rsync --exclude-from=<(cat <<EOF
            *.RData
            *.Rmd
            *.qmd
            *.xlsx
            *.xls
            *.txt
            *.zip
            *.csv
            *.sh
            *.parquet
          EOF
          ) -avr -e 'ssh -p65002 -oHostKeyAlgorithms=+ssh-rsa' ./ \
          u597408863@147.79.103.253:~/domains/fgeerolf.com/public_html/