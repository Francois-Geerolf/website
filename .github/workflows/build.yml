name: Build and Commit Outputs

on:
  push:
    paths:
      - '**.R'
      - '**.Rmd'
      - '_build.R'
  pull_request:
    paths:
      - '**.R'
      - '**.Rmd'
      - '_build.R'
  schedule:
    - cron: '0 3 * * *'   # tous les jours à 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup R
        uses: r-lib/actions/setup-r@v2 
        
      - name: 🧰 Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.550 # or whatever version you use
          
      - name: 🛠 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: 📦 Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: 📦 Install required packages
        run: |
          install.packages(c("ggplot2", "dplyr", "readr", "tibble", "stringr", "forcats", "purrr", "tidyr", "readxl", "rsdmx", "tools", "knitr", "scales", "viridis", "zoo", "lubridate", "ggrepel", "curl", "rmarkdown", "lubridate", "rvest", "gt", "quarto"))
        shell: Rscript {0}

      - name: ▶️ Run _build.R
        run: Rscript _build.R
  
      - name: 🔐 Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
  
      - name: 📤 Deploy to remote server via rsync
        run: |
          rsync --exclude={'*.RData','*.Rmd','*.qmd','*.xlsx','*.xls','*.txt','*.zip','*.csv','*.sh','*.parquet'} \
                -avr -e 'ssh -p65002 -oHostKeyAlgorithms=+ssh-rsa' ./ \
                u597408863@147.79.103.253:~/domains/fgeerolf.com/public_html/