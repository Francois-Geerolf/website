name: Build and Commit Outputs

on:
  push:
    paths:
      - '**.R'
      - '**.Rmd'
      - '**.qmd'
      - '**.yml'
      - '_build.R'
  pull_request:
    paths:
      - '**.R'
      - '**.Rmd'
      - '**.qmd'
      - '**.yml'
      - '_build.R'
  schedule:
    - cron: '0 5 * * *'   # tous les jours à 05:00 UTC
    - cron: '0 11 * * *'  # every day at 11:00 UTC
    - cron: '0 17 * * *'  # every day at 17:00 UTC
    - cron: '0 23 * * *'  # every day at 23:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FRED_KEY: ${{ secrets.FRED_KEY }}
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup R
        uses: r-lib/actions/setup-r@v2 
        
      - name: 🧰 Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.550 # or whatever version you use
          
      - name: 🛠 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: 📦 Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: 📦 Install required packages
        run: |
          install.packages(c(
            "countrycode", "httr", "jsonlite", "ggplot2",
            "dplyr", "readr", "tibble", "stringr", "forcats",
            "purrr", "tidyr", "readxl", "rsdmx", "tools",
            "knitr", "scales", "viridis", "zoo", "lubridate",
            "ggrepel", "curl", "rmarkdown", "rvest", "gt",
            "quarto", "gtExtras"
          ))
        shell: Rscript {0}
        
      - name: 🌍 Add fr_FR.UTF-8 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale

      - name: ▶️ Run _build.R
        run: Rscript _build.R
  
      - name: 🔐 Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      
      - name: 🧾 Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 147.79.103.253 >> ~/.ssh/known_hosts
  
      - name: 📤 Deploy to remote server via rsync
        run: |
          rsync --exclude-from=<(cat <<EOF
            *.RData
            *.Rmd
            *.qmd
            *.xlsx
            *.xls
            *.txt
            *.zip
            *.csv
            *.sh
            *.parquet
          EOF
          ) -avr -e 'ssh -p65002 -oHostKeyAlgorithms=+ssh-rsa' ./ \
          u597408863@147.79.103.253:~/domains/fgeerolf.com/public_html/