          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          <style>
          /* Wide interactive tables: keep them inside their own scroll box
             and let cells wrap instead of clipping text on narrow screens. */
          .reactable .rt-table { scrollbar-width: thin; }
          .reactable .rt-td, .reactable .rt-th { white-space: normal; }
          @media (max-width: 600px) {
            .reactable { font-size: .8rem; }
            .reactable .rt-td, .reactable .rt-th { padding: 4px 6px !important; }
            .cell, .rt-td-inner { white-space: normal !important; word-break: break-word; }
          }
          /* Sous 768px Quarto masque toute la sidebar de marge -- donc aussi le
             bloc "other-links" du yml (Donnees INSEE, Autres donnees, Home). On
             le reaffiche en pied de page, sans le reste du contenu de marge. */
          @media (max-width: 767.98px) {
            #quarto-margin-sidebar {
              display: block !important;
              grid-column: body-content-start / body-content-end !important;
              grid-row: content-bottom / page-bottom !important;
              position: static !important; width: auto !important; max-width: none !important;
              height: auto !important; min-height: 0 !important; overflow: visible !important;
              transform: none !important;
              margin: 1.5rem 0 0 !important; padding: 1rem 0 0 !important;
              border-top: 1px solid #dee2e6 !important;
            }
            #quarto-margin-sidebar > *:not(#TOC),
            #quarto-margin-sidebar #TOC > *:not(.quarto-other-links) { display: none !important; }
            #quarto-margin-sidebar #TOC { display: block !important; }
            #quarto-margin-sidebar .quarto-other-links { display: block !important; margin: 0 !important; }
            #quarto-margin-sidebar .quarto-other-links > h2 {
              font-size: .8rem !important; font-weight: 600 !important; text-transform: uppercase !important;
              letter-spacing: .03em !important; color: #6c757d !important;
              margin: 0 0 .5rem !important; padding: 0 !important; border: 0 !important;
            }
            #quarto-margin-sidebar .quarto-other-links ul {
              display: flex !important; flex-wrap: wrap !important; gap: .4rem 1.1rem !important;
              padding: 0 !important; margin: 0 !important; list-style: none !important;
            }
            #quarto-margin-sidebar .quarto-other-links li { margin: 0 !important; }
            #quarto-margin-sidebar .quarto-other-links a { white-space: nowrap !important; }
          }
          </style>
