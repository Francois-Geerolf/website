# Métadonnées de section « Paris » (appliquées automatiquement par Quarto à
# tous les data/paris/*.qmd). Données ouvertes de la Ville de Paris
# (opendata.paris.fr). Pages + .parquet gardés uniquement dans ~/iCloud
# (pas dans le dépôt git) : rendues par le pipeline local, pas par la CI.
subtitle: '<img src="https://fgeerolf.com/data/logos/paris.png" alt="" style="height:1em;width:1em;object-fit:contain;vertical-align:-0.15em;margin-right:.35em">Données - Ville de Paris'
lang: fr
filters:
  - ../../code/genderize-fr.lua
author:
  - name: François Geerolf
    url: https://fgeerolf.com
editor: source
format:
  html:
    code-fold: true
    toc: true
    theme: [flatly, ../_fgeerolf.scss]
    embed-resources: false
    other-links:
      - text: "Données Ville de Paris"
        href: "https://fgeerolf.com/data/paris/"
      - text: "Autres données"
        href: "https://fgeerolf.com/data/"
        icon: bar-chart-line
      - href: "https://fgeerolf.com/"
        text: "Accueil"
        icon: house
    include-in-header:
      - text: |
          <link rel="icon" href="https://fgeerolf.com/favicon.ico" sizes="any">
          <link rel="icon" type="image/png" href="https://fgeerolf.com/favicon.png" sizes="96x96">
          <link rel="apple-touch-icon" href="https://fgeerolf.com/apple-touch-icon.png">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    include-after-body: ../../statcounter.html
